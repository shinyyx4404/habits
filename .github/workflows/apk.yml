name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Web files
        run: mkdir -p www && cp index.html www/
      - name: Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init Habits com.habits.app --web-dir www
          npx cap add android
      - name: Icon
        continue-on-error: true
        run: |
          npm install --save-dev @capacitor/assets@3
          npx capacitor-assets generate --android --iconBackgroundColor '#2F9E6B' --iconBackgroundColorDark '#2F9E6B'
      - name: Sync
        run: npx cap sync android
      - name: Build
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: habits-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
